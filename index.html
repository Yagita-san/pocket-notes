<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="pocket-notes">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181b" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>pocket-notes</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --text:#1d1d1f; --sub:#6e6e73; --line:#e3e1dc;
  --accent:#2f6fde; --accent-soft:#e7effc; --future:#c2410c; --future-soft:#fdeee6;
  --danger:#d92d20; --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17181b; --card:#222327; --text:#f2f2f4; --sub:#9a9aa1; --line:#34353a;
    --accent:#6ea0ff; --accent-soft:#25324a; --future:#ff9a62; --future-soft:#3b2a20;
    --danger:#ff6b5f; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  font-size:16px;line-height:1.5;
  padding:0 0 calc(88px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
/* 上部（タイトル・ボタン・数字）を固定 */
.top{position:sticky;top:0;z-index:4;background:var(--bg);margin:0 -16px;padding:env(safe-area-inset-top) 16px 0;border-bottom:1px solid var(--line)}
header{padding:16px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:22px;margin:0;letter-spacing:.02em}
.iconbtn{border:none;background:var(--card);border-radius:999px;width:40px;height:40px;box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.stat{background:var(--card);border-radius:14px;padding:10px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--sub)}

h2{font-size:13px;color:var(--sub);font-weight:600;margin:20px 4px 8px;letter-spacing:.04em}
.list{display:flex;flex-direction:column;gap:8px}
.show{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.show-head{width:100%;border:none;background:none;text-align:left;padding:12px 14px;display:flex;gap:12px;align-items:center}
.badge{flex:none;min-width:48px;text-align:center;border-radius:10px;padding:4px 6px;font-size:11px;line-height:1.25;background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge b{display:block;font-size:17px}
.badge.future{background:var(--future-soft);color:var(--future)}
.show-main{flex:1;min-width:0}
.show-title{font-weight:600;overflow-wrap:anywhere}
.show-meta{font-size:13px;color:var(--sub)}
.chev{flex:none;color:var(--sub);transition:transform .2s}
.show.open .chev{transform:rotate(90deg)}
.show-body{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.show.open .show-body{display:block}
.sl-title{font-size:12px;color:var(--sub);font-weight:600;margin:12px 0 4px}
ol.sl{margin:0;padding:0;list-style:none}
ol.sl li{display:flex;gap:10px;padding:3px 0}
ol.sl li i{font-style:normal;color:var(--sub);font-variant-numeric:tabular-nums;min-width:2.4em;text-align:right;font-size:14px;padding-top:1px}
.empty{color:var(--sub);font-size:14px;padding:4px 0}
.memo{margin-top:12px;font-size:14px;background:var(--bg);border-radius:10px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.row-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.btn{border:none;border-radius:10px;padding:8px 14px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn.ghost{background:transparent;color:var(--sub)}

.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin:12px 0 8px;font-size:16px}
.song{background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.song-head{width:100%;border:none;background:none;text-align:left;padding:10px 14px;display:flex;align-items:center;gap:12px}
.rank{flex:none;width:2em;text-align:right;color:var(--sub);font-variant-numeric:tabular-nums;font-size:14px}
.song-name{flex:1;min-width:0;overflow-wrap:anywhere}
.count{flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.count small{font-weight:400;color:var(--sub);font-size:12px;margin-left:2px}
.song-body{display:none;padding:0 14px 10px 48px;font-size:14px}
.song.open .song-body{display:block}
.song-body div{padding:4px 0;border-top:1px solid var(--line)}
.song-body .sub{color:var(--sub);font-size:12px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;border:none;background:none;padding:10px 0 12px;font-size:13px;color:var(--sub);font-weight:600}
nav.tabs button.on{color:var(--accent)}
nav.tabs button span{display:block;font-size:20px;line-height:1.1}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:10;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet h3{margin:0 0 12px;font-size:18px}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12px;color:var(--sub);font-weight:600;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:16px}
.f textarea{min-height:120px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:12px;color:var(--sub);margin:-6px 0 12px}
.paste{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:12px;border:1px dashed var(--line)}
.paste textarea{min-height:90px}
.sheet-foot{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
.menu-item{display:block;width:100%;text-align:left;border:none;background:var(--card);border-radius:12px;padding:14px;margin-bottom:8px;font-weight:600}
.menu-item small{display:block;font-weight:400;color:var(--sub);font-size:12px}
/* 名前の由来ページ */
.about{min-height:70vh}
.about-name{font-size:30px;font-weight:700;letter-spacing:.08em;text-align:center;margin:28px 0 4px}
.about-sub{text-align:center;color:var(--sub);font-size:12px;letter-spacing:.2em;margin-bottom:28px}
.about-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:2;font-size:15px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;padding:0 4px}
.about-text.empty{font-family:inherit;color:var(--sub);text-align:center;line-height:1.6}
.about textarea.long{min-height:50vh;line-height:1.8}
h1{cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.hbtns{display:flex;gap:8px}
.iconbtn.add{background:var(--accent);color:#fff;font-size:24px;line-height:1}
[hidden]{display:none!important}
/* 起動アニメーション */
.splash{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:splashOut .3s ease .6s forwards}
.splash img{width:88px;height:88px;border-radius:22px;box-shadow:0 6px 20px rgba(0,0,0,.15);animation:pop .5s cubic-bezier(.2,.9,.3,1.25) both}
.splash span{font-weight:700;font-size:18px;letter-spacing:.06em;animation:fadeUp .4s ease .15s both}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
body.intro .stat,body.intro .show{animation:fadeUp .45s ease both;animation-delay:calc(var(--intro-delay,.65s) + min(var(--i,0),8) * 50ms)}
/* 起動画像（iPhone内に保存した画像を4秒かけてフェードイン） */
.splash.photo{background:#000;animation:splashOut .6s ease 3.6s forwards}
.splash.photo img{width:100%;height:100%;object-fit:contain;border-radius:0;box-shadow:none;opacity:0;animation:photoIn 3s ease-in-out .1s forwards}
.splash.photo span{display:none}
@keyframes photoIn{to{opacity:1}}
@media (prefers-reduced-motion: reduce){.splash{display:none}body.intro .stat,body.intro .show{animation:none}}
</style>
</head>
<body class="intro">
<div class="splash" id="splash"><img src="icon-180.png" alt=""><span>pocket-notes</span></div>
<script>
// 起動画像が iPhone 内に保存されていれば、アイコンの代わりに使う
(function(){ try{
  var src = localStorage.getItem('pocket-notes:splashImage');
  if(src && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)){
    var sp = document.getElementById('splash'); sp.classList.add('photo'); sp.querySelector('img').src = src;
    document.body.style.setProperty('--intro-delay', '4s'); window.__introMs = 4000;
  }
}catch(e){} })();
</script>
<div class="wrap">
  <div class="top">
  <header>
    <h1 id="appName">pocket-notes</h1>
    <div class="hbtns">
      <button class="iconbtn add" id="addBtn" aria-label="公演を追加">＋</button>
      <button class="iconbtn" id="menuBtn" aria-label="メニュー">⋯</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat" style="--i:0"><b id="stDone">0</b><span>参加回数</span></div>
    <div class="stat" style="--i:1"><b id="stPlan">0</b><span>参加予定</span></div>
    <div class="stat" style="--i:2"><b id="stSongs">0</b><span>生で聴いた曲</span></div>
  </div>
  </div>

  <section id="tabShows">
    <div id="planWrap"><h2>参加予定</h2><div class="list" id="planList"></div></div>
    <div id="doneWrap"><h2>参加済み</h2><div class="list" id="doneList"></div></div>
    <p class="empty" id="noShows" hidden>まだ公演がありません。右上の ＋ から追加するか、メニューの「復元」でバックアップを読み込んでください。</p>
  </section>

  <section id="tabSongs" hidden>
    <input class="search" id="q" type="search" placeholder="曲名で検索（部分一致）" autocomplete="off">
    <div class="list" id="songList"></div>
  </section>
</div>

<nav class="tabs">
  <button class="on" data-tab="shows"><span>🎫</span>公演</button>
  <button data-tab="songs"><span>🎵</span>聴いた曲</button>
</nav>

<!-- 編集シート -->
<div class="sheet-bg" id="editBg">
  <form class="sheet" id="editForm" autocomplete="off">
    <h3 id="editTitle">公演を追加</h3>
    <label class="f"><span>ツアー名</span><input name="tour" required list="tourList"></label>
    <datalist id="tourList"></datalist>
    <div class="two">
      <label class="f"><span>日付</span><input name="date" type="date" required></label>
      <label class="f"><span>日程</span>
        <select name="day">
          <option value="">なし（1日のみ）</option>
          <option>1日目</option><option>2日目</option><option>3日目</option><option>4日目</option>
        </select>
      </label>
    </div>
    <label class="f"><span>会場</span><input name="venue" list="venueList"></label>
    <datalist id="venueList"></datalist>
    <p class="note">今日以降の日付は「参加予定」、過ぎると自動で「参加済み」になります。</p>

    <div class="paste">
      <label class="f" style="margin-bottom:8px"><span>セトリを貼り付け（ネットからコピーしたもの）</span>
        <textarea id="pasteArea" placeholder="1. 曲名&#10;2. 曲名&#10;アンコール&#10;EN1. 曲名"></textarea>
      </label>
      <button type="button" class="btn" id="splitBtn">番号を消して振り分け ↓</button>
    </div>

    <label class="f"><span>本編（1行に1曲）</span><textarea name="main"></textarea></label>
    <label class="f"><span>アンコール（1行に1曲）</span><textarea name="encore" style="min-height:70px"></textarea></label>
    <label class="f"><span>メモ</span><textarea name="memo" style="min-height:70px"></textarea></label>

    <div class="sheet-foot">
      <button type="button" class="btn danger" id="delBtn">削除</button>
      <span style="flex:1"></span>
      <button type="button" class="btn ghost" id="cancelBtn">キャンセル</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</div>

<!-- メニューシート -->
<div class="sheet-bg" id="menuBg">
  <div class="sheet">
    <h3>メニュー</h3>
    <button class="menu-item" id="aboutBtn">名前の由来<small>このアプリの名前に込めた想い</small></button>
    <button class="menu-item" id="exportBtn">バックアップを書き出す<small>JSONファイルとして保存（「ファイル」アプリなどへ）</small></button>
    <button class="menu-item" id="importBtn">バックアップから復元<small>今のデータは置き換わります</small></button>
    <input type="file" id="fileIn" accept=".json,application/json,text/plain" hidden>
    <button class="menu-item" id="splashBtn">起動画像を設定<small>写真から選ぶと、起動時に3秒かけてフェードイン（この iPhone の中にだけ保存）</small></button>
    <button class="menu-item" id="splashOff" hidden>起動画像を外す<small>元のアイコンのアニメーションに戻します</small></button>
    <input type="file" id="imgIn" accept="image/*" hidden>
    <p class="note" id="lastBackup" style="margin:8px 4px 16px"></p>
    <button class="btn ghost" id="menuClose" style="width:100%">閉じる</button>
    <p class="note" style="text-align:center;margin:12px 0 0">version 8</p>
  </div>
</div>

<!-- 名前の由来（中身は iPhone の中にだけ保存） -->
<div class="sheet-bg" id="aboutBg">
  <div class="sheet about">
    <div id="aboutView">
      <div class="about-name" id="aboutName"></div>
      <div class="about-sub">ABOUT THE NAME</div>
      <div class="about-text" id="aboutText"></div>
      <div class="sheet-foot" style="margin-top:28px">
        <button class="btn" id="aboutEdit">編集</button><span style="flex:1"></span>
        <button class="btn ghost" id="aboutClose">閉じる</button>
      </div>
    </div>
    <form id="aboutForm" hidden autocomplete="off">
      <h3>名前の由来を編集</h3>
      <label class="f"><span>アプリ名（画面上部に表示）</span><input name="name" placeholder="pocket-notes"></label>
      <label class="f"><span>由来・想い</span><textarea name="text" class="long"></textarea></label>
      <p class="note">ここに書いた内容は、この iPhone の中とバックアップファイルにだけ保存されます。</p>
      <div class="sheet-foot">
        <span style="flex:1"></span>
        <button type="button" class="btn ghost" id="aboutCancel">キャンセル</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';
const KEY = 'pocket-notes:v1';
const KEY_BK = 'pocket-notes:lastBackup';
const $ = s => document.querySelector(s);

/* ---------- データ ---------- */
let shows = load();
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY) || 'null'); return Array.isArray(d?.shows) ? d.shows.map(clean) : []; }
  catch(e){ return []; }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({version:1, shows})); }
  catch(e){ toast('保存に失敗しました'); }
}
function clean(s){
  return {
    id: String(s.id || uid()),
    tour: String(s.tour || ''), date: String(s.date || ''), day: String(s.day || ''),
    venue: String(s.venue || ''), memo: String(s.memo || ''),
    main: Array.isArray(s.main) ? s.main.map(String).filter(Boolean) : [],
    encore: Array.isArray(s.encore) ? s.encore.map(String).filter(Boolean) : [],
  };
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function today(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
const isPlan = s => s.date >= today();

/* ---------- 文字の正規化 ---------- */
// 全角/半角・大文字/小文字・ひらがな/カタカナを区別しない
function norm(str){
  return String(str).normalize('NFKC').toLowerCase()
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[\s・･~〜～\-‐－—–!！?？.。,、'’"”「」『』]/g, '');
}
// 「天体観測（〇〇ver）」→ 本体「天体観測」とカッコ部分に分ける
function splitVariant(title){
  const t = String(title).trim();
  const m = t.match(/^(.*?)[\s　]*([（(\[［【].*)$/);
  if(m && m[1].trim()) return {base: m[1].trim(), variant: m[2].trim()};
  return {base: t, variant: ''};
}

/* ---------- セトリ貼り付けの解析 ---------- */
function parseSetlist(text){
  const main = [], encore = [];
  let inEncore = false;
  for(let raw of String(text).split(/\r?\n/)){
    let line = raw.replace(/ /g,' ').trim();
    if(!line) continue;
    const n = line.normalize('NFKC').trim();
    // 見出しだけの行（アンコール / EN / Encore / -アンコール- など）
    const bare = n.replace(/^[\s\-–—=＝~〜【\[<＜《(（■◆●▼・*#]+|[\s\-–—=＝~〜】\]>＞》)）:：]+$/g,'');
    if(/^(アンコール|あんこーる|encore|en)\s*\d*$/i.test(bare)){ inEncore = true; continue; }
    // 「EN1. 曲名」「EN 曲名」「アンコール1 曲名」
    const em = n.match(/^(?:en|encore|アンコール)\s*\d*\s*[.．:：)）\-－、]?\s+(.+)$/i)
            || n.match(/^(?:en|encore|アンコール)\s*\d+\s*[.．:：)）\-－、]?\s*(.+)$/i);
    if(em){ inEncore = true; line = stripNum(em[1]); }
    else line = stripNum(line);
    if(!line) continue;
    (inEncore ? encore : main).push(line);
  }
  return {main, encore};
}
function stripNum(s){
  let t = String(s).trim();
  t = t.replace(/^[①-⑳㉑-㉟㊱-㊿]\s*/, '');
  t = t.replace(/^(?:M|#|No\.?|Ｍ|＃)?\s*[0-9０-９]{1,3}\s*(?:[.．:：)）\]］、,，\-－–—]|\s)\s*/i, '');
  return t.trim();
}

/* ---------- 集計 ---------- */
function attendedSorted(){ return shows.filter(s => !isPlan(s)).sort((a,b) => a.date.localeCompare(b.date) || a.day.localeCompare(b.day)); }
function songStats(){
  const map = new Map();
  attendedSorted().forEach((s, i) => {
    const add = (title, part) => {
      const {base, variant} = splitVariant(title);
      const k = norm(base); if(!k) return;
      if(!map.has(k)) map.set(k, {names:new Map(), plays:[]});
      const e = map.get(k);
      e.names.set(base, (e.names.get(base) || 0) + 1);
      e.plays.push({show:s, nth:i+1, part, variant});
    };
    s.main.forEach(t => add(t, '本編'));
    s.encore.forEach(t => add(t, 'アンコール'));
  });
  return [...map.entries()].map(([k, e]) => ({
    key:k,
    name:[...e.names.entries()].sort((a,b) => b[1]-a[1])[0][0],
    plays:e.plays.slice().reverse(),
    count:e.plays.length,
    shows:new Set(e.plays.map(p => p.show.id)).size,
  })).sort((a,b) => b.count - a.count || a.name.localeCompare(b.name, 'ja'));
}

/* ---------- 表示 ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wd = d => '日月火水木金土'[new Date(d + 'T00:00:00').getDay()] || '';
const fmtDate = d => d ? `${d.replace(/-/g,'/')}（${wd(d)}）` : '';
const openShows = new Set(), openSongs = new Set();

/* 起動時だけ数字をカウントアップ */
const reduceMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
let intro = !reduceMotion;
function setNum(sel, v){
  const el = $(sel);
  if(!intro || v === 0){ el.textContent = v; return; }
  el.textContent = 0;
  const start = performance.now() + (window.__introMs || 650), dur = 600;
  const step = now => {
    const t = Math.min(1, Math.max(0, (now - start) / dur));
    el.textContent = Math.round(v * (1 - Math.pow(1 - t, 3)));
    if(t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function endIntro(){ intro = false; document.body.classList.remove('intro'); $('#splash')?.remove(); }

function render(){
  const done = attendedSorted();
  const plan = shows.filter(isPlan).sort((a,b) => a.date.localeCompare(b.date) || a.day.localeCompare(b.day));
  const stats = songStats();
  setNum('#stDone', done.length); setNum('#stPlan', plan.length); setNum('#stSongs', stats.length);

  $('#planWrap').hidden = !plan.length;
  $('#doneWrap').hidden = !done.length;
  $('#noShows').hidden = !!shows.length;
  $('#planList').innerHTML = plan.map((s,i) => showCard(s, null, i + 3)).join('');
  $('#doneList').innerHTML = done.map((s,i) => [s,i+1]).reverse().map(([s,n],i) => showCard(s, n, plan.length + i + 3)).join('');

  renderSongs(stats);
  $('#tourList').innerHTML = [...new Set(shows.map(s => s.tour).filter(Boolean))].map(v => `<option value="${esc(v)}">`).join('');
  $('#venueList').innerHTML = [...new Set(shows.map(s => s.venue).filter(Boolean))].map(v => `<option value="${esc(v)}">`).join('');
}

function showCard(s, nth, idx){
  const days = Math.round((new Date(s.date+'T00:00:00') - new Date(today()+'T00:00:00')) / 86400000);
  const badge = nth
    ? `<div class="badge">通算<b>${nth}</b>回目</div>`
    : `<div class="badge future">${days === 0 ? '<b>今日</b>' : `あと<b>${days}</b>日`}</div>`;
  const list = (arr, prefix) => arr.length
    ? `<ol class="sl">${arr.map((t,i) => `<li><i>${prefix}${i+1}</i><span>${esc(t)}</span></li>`).join('')}</ol>`
    : `<div class="empty">未入力</div>`;
  return `<div class="show${openShows.has(s.id) ? ' open' : ''}" style="--i:${idx}" data-id="${esc(s.id)}">
    <button class="show-head" data-act="toggle">
      ${badge}
      <div class="show-main">
        <div class="show-title">${esc(s.tour)}</div>
        <div class="show-meta">${esc(fmtDate(s.date))}${s.day ? ' ' + esc(s.day) : ''}${s.venue ? '・' + esc(s.venue) : ''}</div>
      </div>
      <span class="chev">›</span>
    </button>
    <div class="show-body">
      <div class="sl-title">本編</div>${list(s.main, '')}
      <div class="sl-title">アンコール</div>${list(s.encore, 'EN')}
      ${s.memo ? `<div class="memo">${esc(s.memo)}</div>` : ''}
      <div class="row-btns"><button class="btn" data-act="edit">編集</button></div>
    </div>
  </div>`;
}

function renderSongs(stats){
  stats = stats || songStats();
  const q = norm($('#q').value || '');
  const rankOf = new Map(); let prev = null, r = 0;
  stats.forEach((s,i) => { if(s.count !== prev){ r = i+1; prev = s.count; } rankOf.set(s.key, r); });
  const list = q ? stats.filter(s => s.key.includes(q) || s.plays.some(p => norm(p.variant).includes(q))) : stats;
  if(!stats.length){ $('#songList').innerHTML = '<p class="empty">参加済み公演のセトリを入力すると、ここに曲ごとの回数が表示されます。</p>'; return; }
  if(!list.length){ $('#songList').innerHTML = '<p class="empty">見つかりませんでした。</p>'; return; }
  $('#songList').innerHTML = list.map(s => `<div class="song${openSongs.has(s.key) ? ' open' : ''}" data-key="${esc(s.key)}">
    <button class="song-head" data-act="song"><span class="rank">${rankOf.get(s.key)}</span><span class="song-name">${esc(s.name)}</span><span class="count">${s.count}<small>回</small></span></button>
    <div class="song-body">${s.plays.map(p => `<div>${esc(fmtDate(p.show.date))} ${esc(p.show.tour)}${p.part === 'アンコール' ? '（アンコール）' : ''}${p.variant ? ' ' + esc(p.variant) : ''}<br><span class="sub">通算${p.nth}回目・${esc(p.show.venue || '')}${p.show.day ? ' ' + esc(p.show.day) : ''}</span></div>`).join('')}</div>
  </div>`).join('');
}

/* ---------- 操作 ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  if(b.dataset.act === 'toggle'){
    const card = b.closest('.show'); const id = card.dataset.id;
    card.classList.toggle('open') ? openShows.add(id) : openShows.delete(id);
  } else if(b.dataset.act === 'edit'){
    openEditor(b.closest('.show').dataset.id);
  } else if(b.dataset.act === 'song'){
    const card = b.closest('.song'); const k = card.dataset.key;
    card.classList.toggle('open') ? openSongs.add(k) : openSongs.delete(k);
  }
});

document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('nav.tabs button').forEach(x => x.classList.toggle('on', x === b));
  const songs = b.dataset.tab === 'songs';
  $('#tabShows').hidden = songs; $('#tabSongs').hidden = !songs;
  window.scrollTo(0,0);
}));
$('#q').addEventListener('input', () => renderSongs());

/* 編集 */
const form = $('#editForm');
let editingId = null, delTimer = null;
function openEditor(id){
  editingId = id || null;
  const s = shows.find(x => x.id === id) || {tour:'',date:'',day:'',venue:'',memo:'',main:[],encore:[]};
  $('#editTitle').textContent = id ? '公演を編集' : '公演を追加';
  form.tour.value = s.tour; form.date.value = s.date; form.day.value = s.day;
  form.venue.value = s.venue; form.memo.value = s.memo;
  form.main.value = s.main.join('\n'); form.encore.value = s.encore.join('\n');
  $('#pasteArea').value = '';
  $('#delBtn').hidden = !id; disarm();
  $('#editBg').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeSheet(id){ $(id).classList.remove('on'); document.body.style.overflow = ''; }
const lines = v => v.split(/\r?\n/).map(t => t.trim()).filter(Boolean);

$('#addBtn').addEventListener('click', () => openEditor(null));
$('#cancelBtn').addEventListener('click', () => closeSheet('#editBg'));
$('#editBg').addEventListener('click', e => { if(e.target.id === 'editBg') closeSheet('#editBg'); });
$('#splitBtn').addEventListener('click', () => {
  const r = parseSetlist($('#pasteArea').value);
  if(!r.main.length && !r.encore.length){ toast('貼り付け欄が空です'); return; }
  form.main.value = r.main.join('\n'); form.encore.value = r.encore.join('\n');
  toast(`本編 ${r.main.length}曲 / アンコール ${r.encore.length}曲`);
});
form.addEventListener('submit', e => {
  e.preventDefault();
  const data = clean({
    id: editingId || uid(),
    tour: form.tour.value.trim(), date: form.date.value, day: form.day.value,
    venue: form.venue.value.trim(), memo: form.memo.value.trim(),
    main: lines(form.main.value), encore: lines(form.encore.value),
  });
  const i = shows.findIndex(x => x.id === data.id);
  if(i >= 0) shows[i] = data; else shows.push(data);
  save(); render(); closeSheet('#editBg'); toast('保存しました');
});
function disarm(){ clearTimeout(delTimer); const b = $('#delBtn'); b.classList.remove('armed'); b.textContent = '削除'; }
$('#delBtn').addEventListener('click', () => {
  const b = $('#delBtn');
  if(!b.classList.contains('armed')){
    b.classList.add('armed'); b.textContent = 'もう一度押すと削除';
    delTimer = setTimeout(disarm, 3000); return;
  }
  shows = shows.filter(x => x.id !== editingId); openShows.delete(editingId);
  save(); render(); closeSheet('#editBg'); toast('削除しました');
});

/* メニュー・バックアップ */
function showLastBackup(){
  let t = ''; try{ t = localStorage.getItem(KEY_BK) || ''; }catch(e){}
  $('#lastBackup').textContent = t ? `最後に書き出した日: ${t}` : 'まだ書き出していません。ときどき書き出しておくと安心です。';
}
$('#menuBtn').addEventListener('click', () => { showLastBackup(); $('#menuBg').classList.add('on'); document.body.style.overflow = 'hidden'; });
$('#menuClose').addEventListener('click', () => closeSheet('#menuBg'));
$('#menuBg').addEventListener('click', e => { if(e.target.id === 'menuBg') closeSheet('#menuBg'); });

$('#exportBtn').addEventListener('click', async () => {
  const json = JSON.stringify({app:'pocket-notes', version:1, exportedAt:new Date().toISOString(), about:getAbout(), shows}, null, 2);
  const name = `pocket-notes-backup-${today()}.json`;
  const file = new File([json], name, {type:'application/json'});
  const done = () => { try{ localStorage.setItem(KEY_BK, today()); }catch(e){} showLastBackup(); };
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file]}); done(); return;
    }
  }catch(e){ if(e.name === 'AbortError') return; }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  done();
});
/* 起動画像 */
const KEY_IMG = 'pocket-notes:splashImage';
function hasSplash(){ try{ return !!localStorage.getItem(KEY_IMG); }catch(e){ return false; } }
function refreshSplashBtns(){ $('#splashOff').hidden = !hasSplash(); }
$('#menuBtn').addEventListener('click', refreshSplashBtns);
$('#splashBtn').addEventListener('click', () => { $('#imgIn').value = ''; $('#imgIn').click(); });
$('#imgIn').addEventListener('change', async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    const url = URL.createObjectURL(f);
    const img = await new Promise((ok, ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ng; i.src = url; });
    // iPhone の画面サイズ程度に縮めて保存（容量節約）
    const scale = Math.min(1, 1290 / img.naturalWidth, 2796 / img.naturalHeight);
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    let data = c.toDataURL('image/jpeg', 0.85);
    if(data.length > 2_000_000) data = c.toDataURL('image/jpeg', 0.6);
    localStorage.setItem(KEY_IMG, data);
    refreshSplashBtns(); toast('起動画像を設定しました。次回の起動から表示されます');
  }catch(err){ toast('この画像は設定できませんでした'); }
});
$('#splashOff').addEventListener('click', () => {
  try{ localStorage.removeItem(KEY_IMG); }catch(e){}
  refreshSplashBtns(); toast('起動画像を外しました');
});

/* 名前の由来 */
const KEY_ABOUT = 'pocket-notes:about';
function getAbout(){
  try{ const a = JSON.parse(localStorage.getItem(KEY_ABOUT) || '{}'); return {name:String(a.name || ''), text:String(a.text || '')}; }
  catch(e){ return {name:'', text:''}; }
}
function setAbout(a){
  try{ localStorage.setItem(KEY_ABOUT, JSON.stringify({name:String(a.name || '').trim(), text:String(a.text || '').trim()})); }
  catch(e){ toast('保存に失敗しました'); }
  applyAppName();
}
function applyAppName(){ $('#appName').textContent = getAbout().name || 'pocket-notes'; }
function showAboutView(){
  const a = getAbout();
  $('#aboutName').textContent = a.name || 'pocket-notes';
  const t = $('#aboutText');
  t.textContent = a.text || 'まだ書かれていません。\n「編集」から、名前に込めた想いを残せます。';
  t.classList.toggle('empty', !a.text);
  $('#aboutView').hidden = false; $('#aboutForm').hidden = true;
}
function openAbout(){ showAboutView(); $('#aboutBg').classList.add('on'); document.body.style.overflow = 'hidden'; }
$('#aboutBtn').addEventListener('click', () => { closeSheet('#menuBg'); openAbout(); });
$('#appName').addEventListener('click', openAbout);
$('#aboutClose').addEventListener('click', () => closeSheet('#aboutBg'));
$('#aboutBg').addEventListener('click', e => { if(e.target.id === 'aboutBg') closeSheet('#aboutBg'); });
$('#aboutEdit').addEventListener('click', () => {
  const a = getAbout(), f = $('#aboutForm');
  f.name.value = a.name; f.text.value = a.text;
  $('#aboutView').hidden = true; f.hidden = false;
});
$('#aboutCancel').addEventListener('click', showAboutView);
$('#aboutForm').addEventListener('submit', e => {
  e.preventDefault(); const f = e.target;
  setAbout({name:f.name.value, text:f.text.value}); showAboutView(); toast('保存しました');
});
applyAppName();

$('#importBtn').addEventListener('click', () => { $('#fileIn').value = ''; $('#fileIn').click(); });
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    const list = Array.isArray(d) ? d : d.shows;
    if(!Array.isArray(list)) throw new Error('format');
    const next = list.map(clean);
    if(!confirm(`${next.length}公演を読み込みます。今のデータ（${shows.length}公演）は置き換わります。よろしいですか？`)) return;
    shows = next; openShows.clear(); openSongs.clear();
    if(d && d.about && typeof d.about === 'object') setAbout(d.about);
    save(); render(); closeSheet('#menuBg'); toast(`${next.length}公演を復元しました`);
  }catch(err){ toast('このファイルは読み込めませんでした'); }
});

let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2200); }

/* 日付が変わったら予定→済みを更新 */
document.addEventListener('visibilitychange', () => { if(!document.hidden) render(); });
try{ navigator.storage?.persist?.(); }catch(e){}
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(() => {}); }

window.__test = {parseSetlist, norm, splitVariant};
render();
intro = false;
setTimeout(endIntro, (window.__introMs || 650) + 1200);
$('#splash')?.addEventListener('click', endIntro);
})();
</script>
</body>
</html>
